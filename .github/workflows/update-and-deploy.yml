name: Update sheet and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 7 * * *" # daily, so the site picks up new sheet rows even without a push
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Pull the latest Google Sheet
        run: python update_sheet.py

      # Pushes made with GITHUB_TOKEN don't trigger workflows, so this can't loop
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/expenses.csv data/junk_food.js junk_food_summary.md
          if git diff --cached --quiet; then
            echo "Sheet unchanged, nothing to commit."
          else
            git commit -m "Update data from Google Sheet"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Build site
        run: |
          mkdir -p _site/data
          cp index.html _site/
          cp data/junk_food.js _site/data/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
